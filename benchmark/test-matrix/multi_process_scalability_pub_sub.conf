# Configuration for Pub-Sub Multi-Process benchmarks

OUTPUT_DIR_NAME="pub-sub_multi_process_scalability"
TOPOLOGIES_DIR="${ROS2_BENCHMARK_SCRIPTS_DIR}/../topologies/pub-sub"
PROFILES_DIR="${ROS2_BENCHMARK_SCRIPTS_DIR}/../profiles"

# Paired topologies
RESULTS=("1_process" "2_process" "5_process" "10_processes")
TOPOLOGY1=( "topology_multi_1_topics_1000hz"
            "topology_multi_2_topics_1000hz"
            "topology_multi_5_topics_1000hz"
            "topology_multi_10_topics_1000hz")
TOPOLOGY2=( "debug_topology_multi_1_topics_1000hz"
            "debug_topology_multi_2_topics_1000hz"
            "debug_topology_multi_5_topics_1000hz"
            "debug_topology_multi_10_topics_1000hz")

# Communication types
RMW_LIST=("fastrtps" "cyclonedds")

# Define COMMS and LOANED_ENV_VARS for each RMW
COMMS_fastrtps=("ipc_off" "loaned")
LOANED_ENV_VARS_fastrtps=(
  "export FASTRTPS_DEFAULT_PROFILES_FILE=${PROFILES_DIR}/shared_memory_fastdds_preallocated_w_realloc.xml"
  "export RMW_FASTRTPS_USE_QOS_FROM_XML=1"
)

COMMS_cyclonedds=("ipc_off")
LOANED_ENV_VARS_cyclonedds=(
  "export CYCLONEDDS_URI=${PROFILES_DIR}/shared_memory_cyclonedds.xml"
)
